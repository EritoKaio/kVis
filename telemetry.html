<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030508" />
    <meta name="description" content="Transparent live KSP flight telemetry widget for OBS." />
    <title>kVis | Telemetry Widget</title>
  </head>
  <body class="telemetry-page">
    <main id="telemetry-app" aria-label="KSP flight telemetry">
      <section class="telemetry-panel">
        <div class="telemetry-gauge" data-gauge="velocity">
          <svg class="gauge-ring" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="gauge-track" cx="120" cy="120" r="108" pathLength="100" />
            <circle class="gauge-progress" cx="120" cy="120" r="108" pathLength="100" />
          </svg>
          <div class="gauge-reading">
            <span class="gauge-value" id="velocity-value">--</span>
            <span class="gauge-unit">KM/H</span>
          </div>
          <span class="gauge-label">VELOCITY</span>
        </div>
        <div class="gforce-reading">
          <span class="gforce-value" id="gforce-value">--</span>
          <span class="gforce-label">G-FORCE</span>
        </div>
        <div class="telemetry-gauge" data-gauge="altitude">
          <svg class="gauge-ring" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="gauge-track" cx="120" cy="120" r="108" pathLength="100" />
            <circle class="gauge-progress" cx="120" cy="120" r="108" pathLength="100" />
          </svg>
          <div class="gauge-reading">
            <span class="gauge-value" id="altitude-value">--</span>
            <span class="gauge-unit">KM</span>
          </div>
          <span class="gauge-label">ALTITUDE</span>
        </div>
        <div class="orientation-placeholder">
          <canvas id="orientation-canvas" aria-label="Live 3D vehicle orientation relative to its orbital body"></canvas>
          <span class="orientation-north-label" aria-label="North">N</span>
        </div>
      </section>
      <p class="telemetry-status" id="telemetry-status" aria-live="polite">WAITING FOR BRIDGE</p>
    </main>
    <script type="module" src="/src/telemetry.js"></script>
  </body>
</html>
